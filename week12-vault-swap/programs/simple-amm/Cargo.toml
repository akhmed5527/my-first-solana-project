[package]
name = "simple-amm"
version = "0.1.0"
description = "Constant product AMM (x*y=k) for Liquidity Vault course project"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "simple_amm"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"
