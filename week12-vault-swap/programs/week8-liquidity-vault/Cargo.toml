[package]
name = "week8-liquidity-vault"
version = "0.1.0"
description = "Liquidity Vault (weeks 8-13) with AMM CPI"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "week8_liquidity_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"
simple-amm = { path = "../simple-amm", features = ["cpi"] }
